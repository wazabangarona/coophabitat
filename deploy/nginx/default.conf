# Serveur web de CoopHabitat : sert l'application Angular et relaie /api vers le serveur Spring Boot.
# Le TLS est terminé en amont (reverse proxy HTTPS de l'hébergeur) ; voir docs/deploiement.md.

map $http_x_forwarded_proto $coop_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;

    # En-têtes de sécurité, répétés dans chaque bloc location qui ajoute ses propres en-têtes.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coop_forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # La documentation interactive de l'API et les sondes ne sont pas publiées par ce serveur.
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        return 404;
    }

    # Fichiers à nom haché : mis en cache longtemps.
    location ~* \.(?:js|css|woff2?|svg|png|webp|ico)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Le service worker et le manifeste doivent toujours être revalidés.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
