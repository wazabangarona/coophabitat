# Intégration continue CoopHabitat : tests serveur + couverture, qualité et tests du frontend,
# puis parcours de bout en bout contre les images Docker réelles (pile de démonstration).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Serveur (tests + couverture JaCoCo ≥ 60 %)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers lance PostgreSQL 16 via le Docker du runner.
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-couverture-serveur
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests unitaires, build production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  e2e:
    name: Parcours de bout en bout (Docker + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COOPHABITAT_HTTP_PORT: '8080'
      # Secrets éphémères propres à ce job : la pile est détruite à la fin.
      COOPHABITAT_DEMO_PASSWORD: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
      COOPHABITAT_JWT_SECRET: ci-jwt-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
      E2E_DEMO_PASSWORD: ci-demo-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - name: Démarrer la pile de démonstration
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color backend web | tail -n 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-playwright
          path: frontend/test-results/
      - name: Arrêter la pile
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
