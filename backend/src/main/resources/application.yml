# Configuration CoopHabitat — toutes les valeurs sensibles proviennent de variables d'environnement.
spring:
  application:
    name: coophabitat
  datasource:
    url: ${COOPHABITAT_DB_URL:jdbc:postgresql://localhost:5432/coophabitat}
    username: ${COOPHABITAT_DB_USER:coophabitat}
    password: ${COOPHABITAT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${COOPHABITAT_DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Africa/Dakar
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${COOPHABITAT_SMTP_HOST:}
    port: ${COOPHABITAT_SMTP_PORT:587}
    username: ${COOPHABITAT_SMTP_USER:}
    password: ${COOPHABITAT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${COOPHABITAT_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${COOPHABITAT_SMTP_STARTTLS:true}

server:
  port: ${PORT:8080}
  forward-headers-strategy: ${COOPHABITAT_FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${COOPHABITAT_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${COOPHABITAT_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  packages-to-scan: sn.coophabitat

logging:
  level:
    root: INFO
    sn.coophabitat: INFO

coophabitat:
  environment: ${COOPHABITAT_ENVIRONMENT:DEVELOPPEMENT}
  frontend-base-url: ${COOPHABITAT_FRONTEND_URL:http://localhost:4200}
  security:
    jwt-secret: ${COOPHABITAT_JWT_SECRET:}
    access-token-ttl: ${COOPHABITAT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${COOPHABITAT_REFRESH_TOKEN_TTL:P7D}
    cookie-secure: ${COOPHABITAT_COOKIE_SECURE:true}
    max-failed-attempts: 5
    lock-duration: PT15M
    password-reset-ttl: PT30M
    invitation-ttl: P3D
    bootstrap-admin-email: ${COOPHABITAT_BOOTSTRAP_ADMIN_EMAIL:}
  cors:
    allowed-origins: ${COOPHABITAT_CORS_ORIGINS:http://localhost:4200}
  payment:
    mock-enabled: ${COOPHABITAT_PAYMENT_MOCK_ENABLED:false}
    mock-webhook-secret: ${COOPHABITAT_PAYMENT_MOCK_SECRET:}
    intent-ttl: PT30M
    minimum-amount: 100
    max-advance-periods: 12
    wave:
      enabled: ${COOPHABITAT_WAVE_ENABLED:false}
      base-url: ${COOPHABITAT_WAVE_BASE_URL:https://api.wave.com}
      api-key: ${COOPHABITAT_WAVE_API_KEY:}
      webhook-secret: ${COOPHABITAT_WAVE_WEBHOOK_SECRET:}
      success-url: ${COOPHABITAT_WAVE_SUCCESS_URL:}
      error-url: ${COOPHABITAT_WAVE_ERROR_URL:}
      timeout: PT10S
    sendflash:
      enabled: false
  contribution:
    generate-for-statuses: ACTIF,SUSPENDU
    reminder-days-before: 3
    reminder-cron: "0 0 8 * * *"
    penalty-cron: "0 30 1 * * *"
    generation-cron: "0 0 1 * * *"
  storage:
    path: ${COOPHABITAT_STORAGE_PATH:./data/documents}
    max-upload-bytes: 10485760
  mail:
    enabled: ${COOPHABITAT_MAIL_ENABLED:false}
    from: ${COOPHABITAT_MAIL_FROM:no-reply@coophabitat.invalid}
  sms:
    provider: ${COOPHABITAT_SMS_PROVIDER:none}
  accounting:
    double-approval-threshold: 500000
  demo:
    enabled: ${COOPHABITAT_DEMO_ENABLED:false}
    password: ${COOPHABITAT_DEMO_PASSWORD:}
  api:
    swagger-enabled: ${COOPHABITAT_SWAGGER_ENABLED:true}
